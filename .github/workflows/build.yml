name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
      - name: Generer la partie Android
        run: flutter create --platforms=android --org com.csophantom --project-name cso_phantom .
      - name: Adapter Android pour le VPN
        run: python3 tool/patch_android.py
      - run: rm -rf test
      - run: flutter pub get
      - run: flutter build apk --release --no-shrink
      - uses: actions/upload-artifact@v4
        with:
          name: cso-phantom-apk
          path: build/app/outputs/flutter-apk/app-release.apk
